name: HandyTranslator
options:
  bundleIdPrefix: com.minoruonda
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0
targets:
  HandyTranslator:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 通訳くん
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 会場の音声を聞き取り、日本語の字幕にします。
        NSSpeechRecognitionUsageDescription: 聞き取った音声を端末の中で文字にします。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minoruonda.handytranslator
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
  HandyTranslatorMac:
    type: application
    platform: macOS
    deploymentTarget: "26.4"
    sources:
      - Sources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: 通訳くん（Mac検証用）
        NSMicrophoneUsageDescription: 会場の音声を聞き取り、日本語の字幕にします。
        NSSpeechRecognitionUsageDescription: 聞き取った音声を端末の中で文字にします。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minoruonda.handytranslator.mac
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: false
